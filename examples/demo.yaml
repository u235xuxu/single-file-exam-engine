meta:
  title: 示例题库 · 财务基础十题
  pass_score: 60

questions:
  - type: 单选
    q: 企业购买一台生产设备，价款100万元，增值税13万元，运输费2万元。该设备的入账价值是多少？
    options:
      - "100 万元"
      - "102 万元"
      - "113 万元"
      - "115 万元"
    answer: B
    explain: |
      固定资产入账价值 = 购买价款 + 相关税费（不含可抵扣增值税） + 运输费等其他直接费用
      = 100 + 2 = 102 万元。
      增值税进项税额 13 万元可抵扣，不计入成本。
    source: 会计 · 固定资产初始计量

  - type: 多选
    q: 下列各项中，属于会计信息质量要求的有？
    options:
      - "可靠性"
      - "相关性"
      - "可理解性"
      - "重要性"
    answer: [A, B, C, D]
    explain: 会计信息质量要求共八项：可靠性、相关性、可理解性、可比性、实质重于形式、重要性、谨慎性、及时性。

  - type: 判断
    q: 企业计提的存货跌价准备，在以后期间不得转回。
    answer: 错
    explain: |
      存货跌价准备可以转回。当以前减记存货价值的影响因素已经消失时，
      减记的金额应当予以恢复，并在原已计提的存货跌价准备金额内转回，计入当期损益。
      （注意区分：固定资产、无形资产等长期资产减值损失一经计提不得转回。）

  - type: 单选
    q: 某企业经营杠杆系数为 2，当销售量增长 10% 时，息税前利润将增长多少？
    options:
      - "5%"
      - "10%"
      - "20%"
      - "无法确定"
    answer: C
    explain: |
      经营杠杆系数 DOL = 息税前利润变动率 ÷ 营业收入变动率
      因此 EBIT 变动率 = DOL × 销量变动率 = 2 × 10% = 20%。

  - type: 填空
    q: 某债券面值 1000 元，票面利率 8%，每年付息一次，期限 5 年，市场利率 10%。该债券的价值约为多少元？（保留整数）
    accept: ["924", "924元", "924.18"]
    explain: |
      债券价值 = 80 × (P/A, 10%, 5) + 1000 × (P/F, 10%, 5)
      = 80 × 3.7908 + 1000 × 0.6209
      = 303.26 + 620.90 = 924.16 ≈ 924 元

  - type: 单选
    q: "下列哪一项不属于变动成本？"
    options:
      - "直接材料"
      - "计件工资"
      - "厂房租金"
      - "按销量计提的销售佣金"
    answer: C
    explain: 厂房租金在相关业务量范围内总额不变，属于固定成本。

  - type: 多选
    q: 关于现金流量表，下列说法正确的有？
    options:
      - "经营活动现金流入包括销售商品收到的现金"
      - "购买固定资产属于投资活动现金流出"
      - "分配股利属于筹资活动现金流出"
      - "支付职工薪酬属于投资活动现金流出"
    answer: [A, B, C]
    explain: |
      A 正确：销售商品、提供劳务收到的现金属于经营活动。
      B 正确：购建固定资产、无形资产支付的现金属于投资活动。
      C 正确：分配股利、利润或偿付利息支付的现金属于筹资活动。
      D 错误：支付给职工以及为职工支付的现金属于经营活动。

  - type: 判断
    q: 采用权益法核算的长期股权投资，被投资单位宣告分派现金股利时，投资方应确认投资收益。
    answer: 错
    explain: |
      权益法下，被投资单位宣告分派现金股利时，投资方应冲减长期股权投资（损益调整），
      不确认投资收益。只有在被投资单位实现净利润时才确认投资收益。

  - type: 填空
    q: 某公司销售收入 500 万元，变动成本率 60%，固定成本 100 万元。其经营杠杆系数为多少？（保留两位小数）
    accept: ["2", "2.0", "2.00"]
    explain: |
      边际贡献 = 500 × (1 − 60%) = 200 万元
      EBIT = 200 − 100 = 100 万元
      DOL = 边际贡献 ÷ EBIT = 200 ÷ 100 = 2

  - type: 简答
    q: 简述资产负债表日后事项中「调整事项」与「非调整事项」的核心区别。
    keywords: ["调整事项", "非调整事项", "报告期", "以前", "已经存在", "重新确认"]
    reference: |
      核心区别在于该事项是否在报告期末已经存在：

      调整事项：对报告期末已经存在的情况提供了新的或进一步证据的事项。
      需要调整报告期的财务报表（如日后取得确凿证据表明期末已发生减值）。

      非调整事项：表明报告期末不存在的情况的事项。
      不调整报告期报表，只在附注中披露（如日后发生火灾、重大诉讼起诉）。

      判断口诀：期末已存在 → 调整；期末不存在、日后新发生 → 不调整只披露。
